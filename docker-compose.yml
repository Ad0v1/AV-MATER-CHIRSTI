# Servicios de infraestructura para desarrollo local.
# Uso: copiar .env.example a .env y ejecutar `docker compose up -d`.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Imagen congelada (bitnamilegacy): solo para desarrollo local. MinIO dejo de publicar
  # imagenes oficiales en Docker Hub/Quay. En produccion se usa Cloudflare R2 (ERS).
  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  # A3 (Dev 1): regla de ciclo de vida del bucket: borra incoming/ (cuarentena de subidas) a 1 dia.
  # Idempotente: crea el bucket si falta y agrega la regla solo si no hay ya una para incoming/;
  # nunca borra ni reemplaza otras reglas del bucket. Termina
  # al aplicarla. Reaplicar a mano: `docker compose run --rm minio-init`. En R2: docs/manuales/tecnico.md.
  minio-init:
    image: bitnamilegacy/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$S3_BUCKET"
        if mc ilm rule ls "local/$$S3_BUCKET" --json 2>/dev/null | grep -q '"prefix":"incoming/"\|"Prefix":"incoming/"'; then
          echo "minio-init: la regla de incoming/ ya existe, no se cambia nada."
        else
          mc ilm rule add --prefix incoming/ --expire-days 1 "local/$$S3_BUCKET"
        fi
        mc ilm rule ls "local/$$S3_BUCKET"

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    # Dev 3, autorizado por el usuario; pendiente de revisión por Dev 1. INSTREAM admite hasta
    # 25M por defecto y las entregas llegan a 50 MiB (RN-08): se sube el límite con las
    # variables CLAMD_CONF_* que la imagen escribe en clamd.conf al arrancar (MaxFileSize ya es 100M).
    environment:
      CLAMD_CONF_StreamMaxLength: 64M
    ports:
      - '${CLAMAV_PORT:-3310}:3310'
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 5

  # Dev 5 (RF-58, U4), autorizado por el usuario: HTML -> PDF de los reportes. Solo en 127.0.0.1
  # (3001). Chromium sin JavaScript y solo con archivos locales del propio formulario: el HTML
  # viene escapado y sin recursos externos (el logo va embebido en base64).
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^file:///tmp/.*
      - --api-timeout=60s
      - --libreoffice-disable-routes=true
      - --webhook-disable=true
      - --api-body-limit=10MB
      - --chromium-max-queue-size=10
      - --chromium-restart-after=50
    # Endurecido (seguridad 5f): sin capacidades y raíz de solo lectura. Chromium necesita escribir
    # en /tmp y en su HOME (/home/gotenberg): ambos van en memoria (tmpfs).
    mem_limit: 1g
    cpus: 1.0
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
      - /home/gotenberg
    ports:
      - '127.0.0.1:${GOTENBERG_PORT:-3001}:3000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  minio_data:
  clamav_data:
